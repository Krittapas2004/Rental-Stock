services:
  - type: web
    name: rentwear
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: "10000"
      - key: ALLOW_SIGNUP
        value: "true"
      - key: NODE_ENV
        value: production
    healthCheckPath: /healthz

