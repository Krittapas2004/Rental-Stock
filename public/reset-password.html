<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — RentWear</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .reset-container {
    max-width: 420px;
    margin: 60px auto;
    padding: 2rem;
  }
  .reset-container h1 { margin-bottom: 0.25rem; }
  .reset-container .text-muted { margin-bottom: 1.5rem; }
  .reset-container label { display: block; margin-bottom: 1rem; font-size: 14px; font-weight: 500; color: var(--ink); }
  .reset-container input { width: 100%; margin-top: 0.35rem; padding: 0.6rem 0.75rem; border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 15px; background: var(--panel); color: var(--ink); }
  .reset-container input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  .reset-container .primary { width: 100%; padding: 0.7rem; font-size: 15px; font-weight: 600; border: none; border-radius: var(--radius-sm); background: var(--primary); color: #fff; cursor: pointer; }
  .reset-container .primary:hover { background: var(--primary-d); }
  .reset-container .primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg-error { color: var(--danger); font-size: 13px; font-weight: 500; min-height: 1.2em; margin: 0.75rem 0; }
  .msg-success { color: var(--primary); font-size: 14px; font-weight: 500; min-height: 1.2em; margin: 0.75rem 0; }
  .hidden { display: none !important; }
  .back-link { text-align: center; margin-top: 1.25rem; font-size: 13px; }
  .back-link a { color: var(--primary); }
</style>
</head>
<body>

<div class="reset-container">
  <h1><span>👗🎒</span> RentWear</h1>

  <!-- Reset Form -->
  <div id="resetForm">
    <p class="text-muted">Enter your new password below.</p>

    <label>New Password
      <input id="newPw" type="password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6">
    </label>
    <label>Confirm New Password
      <input id="confirmPw" type="password" placeholder="Re-enter your new password" autocomplete="new-password">
    </label>

    <p id="resetErr" class="msg-error"></p>

    <button class="primary" id="resetBtn">Reset Password</button>

    <div class="back-link">
      <a href="/">← Back to Sign In</a>
    </div>
  </div>

  <!-- Success Message -->
  <div id="resetSuccess" class="hidden">
    <p class="msg-success" id="resetSuccessMsg"></p>
    <a href="/" class="primary" style="display:block;text-align:center;text-decoration:none;padding:0.7rem;border-radius:var(--radius-sm);margin-top:1rem;">Go to Sign In</a>
  </div>

  <!-- Invalid/Expired Token -->
  <div id="resetInvalid" class="hidden">
    <p class="text-muted" style="color:var(--danger);font-weight:500;">This reset link is invalid or has expired.</p>
    <p class="text-muted">Please request a new password reset from the sign-in page.</p>
    <a href="/" class="primary" style="display:block;text-align:center;text-decoration:none;padding:0.7rem;border-radius:var(--radius-sm);margin-top:1rem;">Go to Sign In</a>
  </div>
</div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if (!token) {
    document.getElementById('resetForm').classList.add('hidden');
    document.getElementById('resetInvalid').classList.remove('hidden');
    return;
  }

  const newPwEl = document.getElementById('newPw');
  const confirmPwEl = document.getElementById('confirmPw');
  const errEl = document.getElementById('resetErr');
  const btn = document.getElementById('resetBtn');

  // Allow Enter key to submit
  [newPwEl, confirmPwEl].forEach(el => {
    el.onkeydown = e => { if (e.key === 'Enter') doReset(); };
  });

  btn.onclick = doReset;

  async function doReset() {
    errEl.textContent = '';
    const pw = newPwEl.value;
    const confirm = confirmPwEl.value;

    if (!pw || pw.length < 6) {
      errEl.textContent = 'Password must be at least 6 characters.';
      return;
    }
    if (pw !== confirm) {
      errEl.textContent = 'Passwords do not match.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Resetting...';

    try {
      const res = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pw })
      });
      const data = await res.json();

      if (!res.ok) {
        if (res.status === 400 && (data.error || '').includes('expired')) {
          document.getElementById('resetForm').classList.add('hidden');
          document.getElementById('resetInvalid').classList.remove('hidden');
          return;
        }
        throw new Error(data.error || 'Reset failed');
      }

      // Success!
      document.getElementById('resetForm').classList.add('hidden');
      document.getElementById('resetSuccess').classList.remove('hidden');
      document.getElementById('resetSuccessMsg').textContent = data.message || 'Password has been reset! You can now sign in.';

    } catch (err) {
      errEl.textContent = err.message;
      btn.disabled = false;
      btn.textContent = 'Reset Password';
    }
  }
})();
</script>
</body>
</html>
