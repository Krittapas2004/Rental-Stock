<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rental Manager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section id="login-view" class="login" hidden>
  <form id="login-form" class="login-card">
    <h1>Rental Manager</h1>
    <p class="muted">Log in to see what is available and manage rentals.</p>
    <label>Username <input id="login-user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
    <label>Password <input id="login-pass" type="password" autocomplete="current-password" required></label>
    <p id="login-error" class="error" role="alert"></p>
    <button class="btn primary" type="submit">Log in</button>
  </form>
</section>

<div id="app-view" hidden>
  <header class="topbar">
    <strong id="shop-name">Rental Manager</strong>
    <nav id="tabs">
      <button data-tab="availability" class="active">Availability</button>
      <button data-tab="sell">New rental</button>
      <button data-tab="orders">Rentals</button>
      <button data-tab="products">Items</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <span class="who"><span id="who-name"></span> <button id="logout" class="btn small">Log out</button></span>
  </header>

  <main>
    <section id="tab-availability" class="tab"></section>
    <section id="tab-sell" class="tab" hidden></section>
    <section id="tab-orders" class="tab" hidden></section>
    <section id="tab-products" class="tab" hidden></section>
    <section id="tab-settings" class="tab" hidden></section>
  </main>
</div>

<div id="toast" role="status"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/availability.js"></script>
<script src="js/products.js"></script>
<script src="js/sell.js"></script>
<script src="js/orders.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
